services:
  - type: web
    name: topic-randomizer
    plan: free
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        value: ""
      - key: SESSION_SECRET
        value: ""
    healthCheckPath: /
